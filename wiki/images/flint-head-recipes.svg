<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" role="img" aria-labelledby="title description">
  <title id="title">Flint head knapping patterns</title>
  <desc id="description">Five distinct 3 by 3 patterns for crafting flint tool heads. F represents flint and S represents string.</desc>
  <rect width="1180" height="340" rx="18" fill="#17212b"/>
  <text x="24" y="36" fill="#f4eee1" font-family="Arial, sans-serif" font-size="24" font-weight="700">KNAP FLINT TOOL HEADS</text>
  <text x="24" y="57" fill="#b9c4ce" font-family="Arial, sans-serif" font-size="13">Place the pattern in the upper-left of the station grid. F = flint, S = string.</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(18 72)">
      <rect width="220" height="250" rx="12" fill="#f4eee1"/>
      <text x="110" y="28" fill="#17212b" font-size="16" font-weight="700">AXE HEAD</text>
      <g transform="translate(52 42)">
        <rect width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="40" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="80" width="36" height="36" rx="4" fill="#d6d0c5"/>
        <rect y="40" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="40" y="40" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="80" y="40" width="36" height="36" rx="4" fill="#d6d0c5"/>
        <rect y="80" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="40" y="80" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="80" y="80" width="36" height="36" rx="4" fill="#d6d0c5"/>
        <g fill="#596876" font-size="18" font-weight="700">
          <rect x="3" y="3" width="30" height="30" rx="3" fill="#596876"/><text x="18" y="25" fill="#fff">F</text>
          <rect x="43" y="3" width="30" height="30" rx="3" fill="#596876"/><text x="58" y="25" fill="#fff">F</text>
          <rect x="3" y="43" width="30" height="30" rx="3" fill="#596876"/><text x="18" y="65" fill="#fff">F</text>
          <rect x="43" y="43" width="30" height="30" rx="3" fill="#b8743e"/><text x="58" y="65" fill="#fff">S</text>
        </g>
      </g>
      <text x="110" y="188" fill="#17212b" font-size="13" font-weight="700">3 flint + 1 string</text>
      <text x="110" y="218" fill="#596876" font-size="12">Shaped pattern</text>
    </g>

    <g transform="translate(250 72)">
      <rect width="220" height="250" rx="12" fill="#f4eee1"/>
      <text x="110" y="28" fill="#17212b" font-size="16" font-weight="700">PICKAXE HEAD</text>
      <g transform="translate(52 42)">
        <rect width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="40" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="80" width="36" height="36" rx="4" fill="#d6d0c5"/>
        <rect y="40" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="40" y="40" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="80" y="40" width="36" height="36" rx="4" fill="#d6d0c5"/>
        <rect y="80" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="40" y="80" width="36" height="36" rx="4" fill="#d6d0c5"/><rect x="80" y="80" width="36" height="36" rx="4" fill="#d6d0c5"/>
        <g font-size="18" font-weight="700">
          <rect x="3" y="3" width="30" height="30" rx="3" fill="#596876"/><text x="18" y="25" fill="#fff">F</text>
          <rect x="43" y="3" width="30" height="30" rx="3" fill="#596876"/><text x="58" y="25" fill="#fff">F</text>
          <rect x="83" y="3" width="30" height="30" rx="3" fill="#596876"/><text x="98" y="25" fill="#fff">F</text>
          <rect x="43" y="43" width="30" height="30" rx="3" fill="#b8743e"/><text x="58" y="65" fill="#fff">S</text>
        </g>
      </g>
      <text x="110" y="188" fill="#17212b" font-size="13" font-weight="700">3 flint + 1 string</text>
      <text x="110" y="218" fill="#596876" font-size="12">Shaped pattern</text>
    </g>

