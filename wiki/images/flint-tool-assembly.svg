<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 260" role="img" aria-labelledby="title description">
  <title id="title">Flint tool assembly recipes</title>
  <desc id="description">Assemble each flint tool shapelessly from its matching head and sticks at the knapping station.</desc>
  <rect width="1180" height="260" rx="18" fill="#17212b"/>
  <text x="24" y="36" fill="#f4eee1" font-family="Arial, sans-serif" font-size="24" font-weight="700">ASSEMBLE TOOLS AT THE STATION</text>
  <text x="24" y="57" fill="#b9c4ce" font-family="Arial, sans-serif" font-size="13">These assembly recipes are shapeless.</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(18 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT AXE</text>
      <rect x="18" y="48" width="76" height="42" rx="7" fill="#596876"/><text x="56" y="74" fill="#fff" font-size="12" font-weight="700">AXE HEAD</text>
      <text x="110" y="76" fill="#17212b" font-size="20" font-weight="700">+</text>
      <rect x="126" y="48" width="76" height="42" rx="7" fill="#b8743e"/><text x="164" y="74" fill="#fff" font-size="12" font-weight="700">2 STICKS</text>
      <path d="M90 112h40m-8-8 8 8-8 8" fill="none" stroke="#17212b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="143" fill="#17212b" font-size="13" font-weight="700">1 axe head + 2 sticks</text>
    </g>
    <g transform="translate(250 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT PICKAXE</text>
      <rect x="18" y="48" width="76" height="42" rx="7" fill="#596876"/><text x="56" y="74" fill="#fff" font-size="10" font-weight="700">PICKAXE HEAD</text>
      <text x="110" y="76" fill="#17212b" font-size="20" font-weight="700">+</text>
      <rect x="126" y="48" width="76" height="42" rx="7" fill="#b8743e"/><text x="164" y="74" fill="#fff" font-size="12" font-weight="700">2 STICKS</text>
      <path d="M90 112h40m-8-8 8 8-8 8" fill="none" stroke="#17212b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="143" fill="#17212b" font-size="12" font-weight="700">1 pickaxe head + 2 sticks</text>
    </g>
    <g transform="translate(482 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT HOE</text>
      <rect x="18" y="48" width="76" height="42" rx="7" fill="#596876"/><text x="56" y="74" fill="#fff" font-size="12" font-weight="700">HOE HEAD</text>
      <text x="110" y="76" fill="#17212b" font-size="20" font-weight="700">+</text>
      <rect x="126" y="48" width="76" height="42" rx="7" fill="#b8743e"/><text x="164" y="74" fill="#fff" font-size="12" font-weight="700">2 STICKS</text>
      <path d="M90 112h40m-8-8 8 8-8 8" fill="none" stroke="#17212b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="143" fill="#17212b" font-size="13" font-weight="700">1 hoe head + 2 sticks</text>
    </g>
    <g transform="translate(714 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT SHOVEL</text>
      <rect x="18" y="48" width="76" height="42" rx="7" fill="#596876"/><text x="56" y="74" fill="#fff" font-size="11" font-weight="700">SHOVEL HEAD</text>
      <text x="110" y="76" fill="#17212b" font-size="20" font-weight="700">+</text>
      <rect x="126" y="48" width="76" height="42" rx="7" fill="#b8743e"/><text x="164" y="74" fill="#fff" font-size="12" font-weight="700">2 STICKS</text>
      <path d="M90 112h40m-8-8 8 8-8 8" fill="none" stroke="#17212b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="143" fill="#17212b" font-size="12" font-weight="700">1 shovel head + 2 sticks</text>
    </g>
    <g transform="translate(946 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT KNIFE</text>
      <rect x="18" y="48" width="76" height="42" rx="7" fill="#596876"/><text x="56" y="74" fill="#fff" font-size="12" font-weight="700">KNIFE HEAD</text>
      <text x="110" y="76" fill="#17212b" font-size="20" font-weight="700">+</text>
      <rect x="126" y="48" width="76" height="42" rx="7" fill="#b8743e"/><text x="164" y="74" fill="#fff" font-size="12" font-weight="700">1 STICK</text>
      <path d="M90 112h40m-8-8 8 8-8 8" fill="none" stroke="#17212b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="143" fill="#17212b" font-size="13" font-weight="700">1 knife head + 1 stick</text>
    </g>
  </g>
</svg>
