<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 260" role="img" aria-labelledby="title description">
  <title id="title">Flint tool assembly recipes</title>
  <desc id="description">At the knapping station, place the matching tool head in the top-center slot, string in the center slot, and a stick in the bottom-center slot.</desc>
  <rect width="1180" height="260" rx="18" fill="#17212b"/>
  <text x="24" y="36" fill="#f4eee1" font-family="Arial, sans-serif" font-size="24" font-weight="700">ASSEMBLE TOOLS AT THE STATION</text>
  <text x="24" y="57" fill="#b9c4ce" font-family="Arial, sans-serif" font-size="13">Top to bottom: matching tool head, string, stick.</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(18 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT AXE</text>
      <rect x="76" y="38" width="68" height="28" rx="5" fill="#596876"/><text x="110" y="56" fill="#fff" font-size="10" font-weight="700">AXE HEAD</text>
      <rect x="76" y="70" width="68" height="28" rx="5" fill="#8c765d"/><text x="110" y="88" fill="#fff" font-size="11" font-weight="700">STRING</text>
      <rect x="76" y="102" width="68" height="28" rx="5" fill="#b8743e"/><text x="110" y="120" fill="#fff" font-size="11" font-weight="700">STICK</text>
      <text x="110" y="149" fill="#17212b" font-size="12" font-weight="700">Head + string + stick</text>
    </g>
    <g transform="translate(250 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT PICKAXE</text>
      <rect x="76" y="38" width="68" height="28" rx="5" fill="#596876"/><text x="110" y="56" fill="#fff" font-size="9" font-weight="700">PICKAXE HEAD</text>
      <rect x="76" y="70" width="68" height="28" rx="5" fill="#8c765d"/><text x="110" y="88" fill="#fff" font-size="11" font-weight="700">STRING</text>
      <rect x="76" y="102" width="68" height="28" rx="5" fill="#b8743e"/><text x="110" y="120" fill="#fff" font-size="11" font-weight="700">STICK</text>
      <text x="110" y="149" fill="#17212b" font-size="12" font-weight="700">Head + string + stick</text>
    </g>
    <g transform="translate(482 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT HOE</text>
      <rect x="76" y="38" width="68" height="28" rx="5" fill="#596876"/><text x="110" y="56" fill="#fff" font-size="10" font-weight="700">HOE HEAD</text>
      <rect x="76" y="70" width="68" height="28" rx="5" fill="#8c765d"/><text x="110" y="88" fill="#fff" font-size="11" font-weight="700">STRING</text>
      <rect x="76" y="102" width="68" height="28" rx="5" fill="#b8743e"/><text x="110" y="120" fill="#fff" font-size="11" font-weight="700">STICK</text>
      <text x="110" y="149" fill="#17212b" font-size="12" font-weight="700">Head + string + stick</text>
    </g>
    <g transform="translate(714 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT SHOVEL</text>
      <rect x="76" y="38" width="68" height="28" rx="5" fill="#596876"/><text x="110" y="56" fill="#fff" font-size="9" font-weight="700">SHOVEL HEAD</text>
      <rect x="76" y="70" width="68" height="28" rx="5" fill="#8c765d"/><text x="110" y="88" fill="#fff" font-size="11" font-weight="700">STRING</text>
      <rect x="76" y="102" width="68" height="28" rx="5" fill="#b8743e"/><text x="110" y="120" fill="#fff" font-size="11" font-weight="700">STICK</text>
      <text x="110" y="149" fill="#17212b" font-size="12" font-weight="700">Head + string + stick</text>
    </g>
    <g transform="translate(946 76)">
      <rect width="220" height="160" rx="12" fill="#f4eee1"/>
      <text x="110" y="26" fill="#17212b" font-size="16" font-weight="700">FLINT KNIFE</text>
      <rect x="76" y="38" width="68" height="28" rx="5" fill="#596876"/><text x="110" y="56" fill="#fff" font-size="10" font-weight="700">KNIFE HEAD</text>
      <rect x="76" y="70" width="68" height="28" rx="5" fill="#8c765d"/><text x="110" y="88" fill="#fff" font-size="11" font-weight="700">STRING</text>
      <rect x="76" y="102" width="68" height="28" rx="5" fill="#b8743e"/><text x="110" y="120" fill="#fff" font-size="11" font-weight="700">STICK</text>
      <text x="110" y="149" fill="#17212b" font-size="12" font-weight="700">Head + string + stick</text>
    </g>
  </g>
</svg>
