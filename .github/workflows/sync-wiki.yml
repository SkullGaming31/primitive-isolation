name: Sync project wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check whether the GitHub Wiki is initialized
        id: wiki
        run: |
          wiki_url="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          if output=$(git ls-remote "$wiki_url" HEAD 2>&1); then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$output" | grep -qi "repository not found"; then
            echo "::warning title=GitHub Wiki not initialized::Create the first page from the repository Wiki tab, then run this workflow again."
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: Check out GitHub Wiki
        if: steps.wiki.outputs.initialized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"

      - name: Publish wiki folder
        if: steps.wiki.outputs.initialized == 'true'
        run: |
          rsync -a --delete --exclude='.git/' "$GITHUB_WORKSPACE/wiki/" "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "GitHub Wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA}"
          branch="$(git branch --show-current)"
          git push origin "HEAD:${branch}"
